<style>
:root {
  --navy:   #010B2E;
  --orange: #FE6D13;
  --orange-hi: #ff8c42;
  --white:  #ffffff;
  --muted:  rgba(255,255,255,.42);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Montserrat', sans-serif;
  background: var(--navy); color: var(--white);
  overflow-x: hidden; min-height: 100vh;
}
a { color: inherit; text-decoration: none; }

.bg-mesh {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 60% 50% at 80% 8%, rgba(254,109,19,.11) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 8% 90%, rgba(2,17,87,.65) 0%, transparent 65%);
}
.bg-lines {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: repeating-linear-gradient(-48deg, transparent, transparent 90px, rgba(255,255,255,.025) 90px, rgba(255,255,255,.025) 91px);
}

#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 999;
  padding: 0 48px; height: 66px;
  display: flex; align-items: center; justify-content: space-between;
  background: rgba(1,11,46,.9); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.nav-logo { font-size: 20px; font-weight: 900; letter-spacing: -1px; }
.nav-logo span { color: var(--orange); }
.nav-back {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,.38);
  transition: color .2s;
}
.nav-back:hover { color: var(--white); }
@media (max-width: 560px) { #nav { padding: 0 20px; } .nav-back { display: none; } }

.shell {
  position: relative; z-index: 1;
  max-width: 640px; margin: 0 auto;
  padding: 128px 40px 96px;
}
@media (max-width: 600px) { .shell { padding: 104px 20px 72px; } }

/* ── STATUS ICON ── */
.status-icon {
  display: flex; align-items: center; justify-content: center;
  width: 72px; height: 72px; border-radius: 50%;
  margin: 0 auto 32px;
  animation: pop .5s cubic-bezier(.34,1.56,.64,1) both;
}
.status-icon.valid {
  background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3);
}
.status-icon.invalid {
  background: rgba(254,109,19,.1); border: 1px solid rgba(254,109,19,.28);
}
.status-icon svg { width: 32px; height: 32px; }
@keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ── HERO ── */
.hero { text-align: center; margin-bottom: 48px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(254,109,19,.1); border: 1px solid rgba(254,109,19,.22);
  border-radius: 100px; padding: 7px 18px; margin-bottom: 24px;
  font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px;
  text-transform: uppercase; color: var(--orange);
}
.hero-h1 {
  font-weight: 900; font-size: clamp(36px, 5.5vw, 58px);
  letter-spacing: -2px; line-height: 1.02; margin-bottom: 14px;
}
.hero-h1 em {
  font-family: 'DM Serif Display', serif;
  font-style: italic; font-weight: 400; color: var(--orange);
}
.hero-sub {
  font-size: 15px; font-weight: 500; color: var(--muted); line-height: 1.7;
}

/* ── CERT ID DISPLAY ── */
.cert-id-wrap {
  text-align: center; margin-bottom: 40px;
  padding: 28px 24px;
  border: 1.5px solid rgba(254,109,19,.28); border-radius: 8px;
  background: rgba(254,109,19,.05);
}
.cert-id-label {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: rgba(255,255,255,.32); margin-bottom: 12px;
}
.cert-id-value {
  font-size: clamp(22px, 4.5vw, 32px); font-weight: 900;
  letter-spacing: 3px; color: var(--orange);
}
.cert-id-empty {
  font-size: 18px; font-weight: 600; color: rgba(255,255,255,.25);
  font-style: italic;
}

/* ── DETAIL CARD ── */
.detail-card {
  background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
  border-radius: 10px; padding: 28px; margin-bottom: 28px;
}
.detail-card-title {
  font-size: 10px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--orange); margin-bottom: 20px;
}
.detail-rows { display: flex; flex-direction: column; gap: 0; }
.detail-row {
  display: flex; gap: 16px; align-items: flex-start;
  padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06);
}
.detail-row:last-child { border-bottom: none; padding-bottom: 0; }
.detail-key {
  font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.32);
  min-width: 120px; padding-top: 1px;
}
.detail-val { font-size: 14px; font-weight: 600; color: var(--white); line-height: 1.5; }
.badge-verified {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.3);
  border-radius: 100px; padding: 4px 12px;
  font-size: 11px; font-weight: 700; color: #4ade80;
}
@media (max-width: 480px) { .detail-row { flex-direction: column; gap: 4px; } .detail-key { min-width: unset; } }

/* ── MANUAL CHECK ── */
.manual-check {
  background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.07);
  border-radius: 8px; padding: 22px 24px; margin-bottom: 28px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.38);
  line-height: 1.65; text-align: center;
}
.manual-check a { color: var(--orange); border-bottom: 1px solid rgba(254,109,19,.3); transition: border-color .2s; }
.manual-check a:hover { border-color: var(--orange); }

/* ── CTA ── */
.cta { text-align: center; }
.btn-primary {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 14px 34px; background: var(--orange); color: var(--white);
  font-size: 11.5px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; border-radius: 4px;
  font-family: 'Montserrat', sans-serif;
  transition: background .2s, transform .18s, box-shadow .2s;
}
.btn-primary:hover {
  background: var(--orange-hi); transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(254,109,19,.28);
}

/* ── FOOTER ── */
footer {
  position: relative; z-index: 1;
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 26px 48px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 12px;
}
.footer-copy { font-size: 11px; color: rgba(255,255,255,.18); font-weight: 500; }
.footer-link {
  font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: rgba(255,255,255,.22);
  transition: color .2s;
}
.footer-link:hover { color: rgba(255,255,255,.5); }
@media (max-width: 600px) { footer { padding: 22px 20px; flex-direction: column; text-align: center; } }
</style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="bg-lines"></div>

<nav id="nav">
  <a href="/" class="nav-logo">DIAL<span>X</span></a>
  <a href="/" class="nav-back">← Back to DialX</a>
</nav>

<div class="shell" id="shell">
  <!-- content injected by JS -->
</div>

<footer>
  <span class="footer-copy">© 2026 DialX Africa. All rights reserved.</span>
  <a href="/" class="footer-link">← DialX Africa</a>
</footer>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var id     = (params.get('id') || '').trim().toUpperCase();
  var valid  = /^DX-2026-\d{6}$/.test(id);
  var shell  = document.getElementById('shell');

  function icon(ok) {
    return ok
      ? '<svg viewBox="0 0 32 32" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6,16 13,23 26,9"/></svg>'
      : '<svg viewBox="0 0 32 32" fill="none" stroke="#FE6D13" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="12"/><line x1="16" y1="10" x2="16" y2="17"/><circle cx="16" cy="22" r="1" fill="#FE6D13"/></svg>';
  }

  if (valid) {
    document.title = 'Certificate Verified — DialX Impact 2026';
    shell.innerHTML =
      '<div class="hero">' +
        '<div class="status-icon valid" aria-hidden="true">' + icon(true) + '</div>' +
        '<div class="hero-badge">Certificate Verified</div>' +
        '<h1 class="hero-h1">This certificate<br>is <em>authentic.</em></h1>' +
        '<p class="hero-sub">The certificate ID below is a valid DialX Impact 2026 Certificate of Appreciation.</p>' +
      '</div>' +
      '<div class="cert-id-wrap">' +
        '<div class="cert-id-label">Certificate ID</div>' +
        '<div class="cert-id-value">' + id + '</div>' +
      '</div>' +
      '<div class="detail-card">' +
        '<div class="detail-card-title">Certificate Details</div>' +
        '<div class="detail-rows">' +
          '<div class="detail-row"><span class="detail-key">Event</span><span class="detail-val">DialX Impact 2026</span></div>' +
          '<div class="detail-row"><span class="detail-key">Edition</span><span class="detail-val">Edition 01</span></div>' +
          '<div class="detail-row"><span class="detail-key">Date</span><span class="detail-val">25 July 2026</span></div>' +
          '<div class="detail-row"><span class="detail-key">Location</span><span class="detail-val">Redemption City, Nigeria</span></div>' +
          '<div class="detail-row"><span class="detail-key">Issued by</span><span class="detail-val">DialX Africa</span></div>' +
          '<div class="detail-row"><span class="detail-key">Status</span><span class="detail-val"><span class="badge-verified">✓ Verified</span></span></div>' +
        '</div>' +
      '</div>' +
      '<div class="manual-check">Recipient details are kept private. To confirm a specific recipient\'s identity, contact us at <a href="mailto:hello@dialxafrica.com">hello@dialxafrica.com</a>.</div>' +
      '<div class="cta">' +
        '<a href="/certificate" class="btn-primary">' +
          '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 7h6M5 10h4"/></svg>' +
          'Get Your Certificate' +
        '</a>' +
      '</div>';
  } else if (id) {
    /* id present but invalid format */
    document.title = 'Invalid Certificate ID — DialX';
    shell.innerHTML =
      '<div class="hero">' +
        '<div class="status-icon invalid" aria-hidden="true">' + icon(false) + '</div>' +
        '<div class="hero-badge">Verification Failed</div>' +
        '<h1 class="hero-h1">Certificate ID<br><em>not recognised.</em></h1>' +
        '<p class="hero-sub">The ID <strong style="color:#fff;letter-spacing:1px">' + id + '</strong> is not a valid DialX Impact 2026 certificate ID. Check the ID on the certificate and try again.</p>' +
      '</div>' +
      '<div class="manual-check">If you believe this is an error, contact us at <a href="mailto:hello@dialxafrica.com">hello@dialxafrica.com</a> with the certificate ID and we\'ll verify it manually.</div>' +
      '<div class="cta">' +
        '<a href="/certificate" class="btn-primary">Generate Your Certificate</a>' +
      '</div>';
  } else {
    /* no id — show lookup form */
    document.title = 'Verify a Certificate — DialX Impact 2026';
    shell.innerHTML =
      '<div class="hero">' +
        '<div class="hero-badge">Certificate Verification</div>' +
        '<h1 class="hero-h1">Verify a<br><em>Certificate.</em></h1>' +
        '<p class="hero-sub">Enter a DialX Impact 2026 certificate ID below to verify its authenticity.</p>' +
      '</div>' +
      '<div class="detail-card" style="margin-bottom:28px">' +
        '<div class="detail-card-title">Enter Certificate ID</div>' +
        '<div style="display:flex;gap:12px;flex-wrap:wrap">' +
          '<input id="id-input" type="text" placeholder="DX-2026-123456" style="flex:1;min-width:180px;padding:13px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#fff;font-family:Montserrat,sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;outline:none;transition:border-color .2s" />' +
          '<button id="verify-btn" style="padding:13px 28px;background:#FE6D13;color:#fff;border:none;border-radius:4px;font-family:Montserrat,sans-serif;font-size:11.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;cursor:pointer;white-space:nowrap">Verify</button>' +
        '</div>' +
      '</div>' +
      '<div class="cta"><a href="/certificate" class="btn-primary">Get Your Own Certificate</a></div>';

    setTimeout(function () {
      var inp = document.getElementById('id-input');
      var btn = document.getElementById('verify-btn');
      if (!inp || !btn) return;
      inp.addEventListener('focus', function () { inp.style.borderColor = 'rgba(254,109,19,.55)'; });
      inp.addEventListener('blur', function () { inp.style.borderColor = 'rgba(255,255,255,.1)'; });
      function go() {
        var v = inp.value.trim().toUpperCase();
        if (!v) return;
        window.location.href = '/verify?id=' + encodeURIComponent(v);
      }
      btn.addEventListener('click', go);
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
    }, 0);
  }

  try { if (window.posthog) posthog.capture('certificate_verify_view', { id: id, valid: valid }); } catch(e) {}
})();
</script>
</body>
</html>
